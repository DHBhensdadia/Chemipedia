<div class="grp" data-mode="group">
  <section class="grp-hero grp-hero--index">
    <div class="shell">
      <p class="grp-hero__eyebrow">Reference</p>
      <h1 class="grp-hero__name">Element groups</h1>
      <p class="grp-hero__lede">{{lede}}</p>
    </div>
  </section>

  <section class="grp-body">
    <div class="shell">
      <h2 class="visually-hidden">The eleven groups of the periodic table</h2>
      <ul class="grp-cards">
{{cards}}
      </ul>
    </div>
  </section>
</div>
